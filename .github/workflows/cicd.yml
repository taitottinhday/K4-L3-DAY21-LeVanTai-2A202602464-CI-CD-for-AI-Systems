name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - ".github/workflows/cicd.yml"
      - "scripts/**.py"
      - "requirements.txt"
      - ".dvc/config"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: income-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      AWS_REGION: ap-southeast-1
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlartifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Configure S3 DVC remote
        shell: bash
        run: |
          test -n "$ARTIFACT_BUCKET" || { echo "ARTIFACT_BUCKET secret is missing"; exit 1; }
          dvc remote add -f labstore "s3://${ARTIFACT_BUCKET}/dvc"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        shell: bash
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Stage candidate model and report
        run: python -m scripts.stage_model

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: python -m src.quality_gate --f1 "$F1"

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install release dependency
        run: python -m pip install boto3==1.34.131

      - name: Authenticate and promote only if F1 does not regress
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Promote only if F1 does not regress
        run: python -m scripts.promote_model

      - name: Deploy and health-check through SSM
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        run: |
          test -n "$INSTANCE_ID" || { echo "INSTANCE_ID secret is missing"; exit 1; }
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo systemctl restart income-api","for attempt in $(seq 1 12); do curl --fail --silent --show-error http://127.0.0.1:8080/healthz && exit 0; sleep 5; done; exit 1"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
